
quarkus.flyway.migrate-at-start=true

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:carebridge_user}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/carebridge_db}

# Separate database for automated tests
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5432/carebridge_test_db
%test.quarkus.flyway.migrate-at-start=true
# Keycloak / OpenID Connect
quarkus.oidc.auth-server-url=http://localhost:8180/realms/carebridge
quarkus.oidc.client-id=carebridge-api
quarkus.oidc.application-type=service

# Do not automatically create an additional Keycloak Dev Service
quarkus.keycloak.devservices.enabled=false
# CORS for local Vue frontend
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type